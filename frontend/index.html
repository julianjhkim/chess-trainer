<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chess-trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>">
  <link rel="stylesheet" href="/vendor/chessground/chessground.base.css">
  <link rel="stylesheet" href="/vendor/chessground/chessground.brown.css">
  <link rel="stylesheet" href="/vendor/chessground/chessground.cburnett.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">♞</span>
      <h1>chess-trainer</h1>
    </div>
    <nav id="stepbar" class="stepbar" aria-label="Session steps"></nav>
    <div id="streak" class="streak" aria-live="polite"></div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <footer class="statusbar">
    <span id="status" class="status"></span>
    <span id="engine-info" class="engine-info"></span>
  </footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
